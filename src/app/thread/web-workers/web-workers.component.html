<div style="margin: 20px 50px 20px 50px;">

    <!------- Single Thread Example ------>
    <small>Print the 100 Numbers in Single Thread</small><br>
    <button mat-raised-button color="warn" (click)="find10thPrimeNumber()">Click here</button>
    <div>The prime number is {{ prime10 }}</div> <br />
    <hr>
    <button mat-raised-button color="warn" (click)="find10000thPrimeNumber()">Click Me</button>
    <div>The 10000<sup>th</sup> prime number is {{ prime10000 }}</div>

    <hr>


    <!-- <button mat-raised-button color="primary" (click)="calculate()">Calculate</button> -->
    <!-- <button mat-raised-button color="primary" (click)="calculateFinal()">Multiple Thread</button> -->



    <div class="col-6 ms-3">
        <input class="form-control" placeholder="Type a number" type="number" [ngModel]="value"
            (ngModelChange)="modelChange($event)" />
        <p class="text-muted ms-2">The larger the value, the greater the delay</p>
        <p *ngIf="value != null && value <= 0" class="text-danger ms-2">
            <small>Value should be a positive number!</small>
        </p>
        <p *ngIf="isCalculating" class="text-success ms-2">Calculating...</p>
        <div *ngIf="result != null" class="alert alert-info mt-2" role="alert">
            {{ result }}...
        </div>
    </div>
</div>
